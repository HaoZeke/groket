# Example user rule — copy to ~/.groket/rules/ (same id replaces a bundled rule).
#
#   mkdir -p ~/.groket/rules
#   cp examples/detection/starters/rules/repeated-shell-cd.yaml ~/.groket/rules/
#
# Requires detector `repeated_shell_cd` (see examples/detection/starters/detectors/).
# Generate pair from scratch:
#   uv run groket gen detector repeated_shell_cd
#   uv run groket gen rule repeated-shell-cd --detector repeated_shell_cd

rules:
  - id: repeated-shell-cd
    description: "Many consecutive shell cd commands (directory thrashing)"
    category: Custom
    severity: medium
    enabled: true
    detector: repeated_shell_cd
    params:
      min_streak: 4
      tools:
        - run_terminal_command
        - bash
        - shell
    summary: "Directory thrashing — {count} consecutive cd commands"
    detail: |
      The agent issued {count} consecutive `cd` commands (threshold {min_streak}).
      First in streak: {first_cmd}
    recommendation: >
      Prefer absolute paths or a single cd into the working tree, then operate
      with relative paths instead of bouncing directories.
