# yaml-language-server: $schema=https://indynull.github.io/groket/schemas/rules.schema.json
# Local schema: schemas/rules.schema.json (make schema)
# Validate: uv run groket rules validate examples/detection/catalog/rules/rules.yaml
#
# =============================================================================
# EVALUATION RULES
# =============================================================================
#

# Each rule detects a specific bad behavior pattern in model traces.
# Rules are evaluated against parsed tool calls and chat messages.
#
# HOW TO READ THIS FILE:
#   - `id`:          Unique identifier for the rule
#   - `description`: Human-readable explanation of what the rule detects
#   - `category`:    V2 taxonomy (e.g. "Tool Call Inefficiencies", "Transparency")
#   - `severity`:    high | medium | low
#   - `enabled`:     true | false (disabled rules are skipped)
#   - `detector`:    Name of the Python detector function that runs the check
#   - `params`:      Parameters passed to the detector (thresholds, regexes, etc.)
#   - `summary`:     Template for the issue title. Use {variables} from the detector.
#   - `detail`:      Template for the issue body. Use {variables} from the detector.
#   - `recommendation`: What the model should have done instead.
#
# HOW TO TUNE:
#   Change `params` values to adjust sensitivity. Common tuning:
#   - Raise thresholds to reduce noise
#   - Lower thresholds to catch more issues
#   - Edit regex patterns to match/exclude specific commands
#   - Set `enabled: false` to disable a rule entirely
#
# HOW TO ADD A NEW RULE:
#   1. Copy an existing rule block
#   2. Change the id, description, and params
#   3. Pick a detector (see AVAILABLE DETECTORS below)
#   4. If no existing detector fits, write a plugin .py file
#
# AVAILABLE DETECTORS:
#   Generic (reusable, fully parameterized by YAML):
#     count_matching_calls   — Count tool calls matching filters
#     repeated_identical_calls — Same call repeated with no mutations
#     session_metric         — Session-wide metric (ratio, density)
#     time_gap               — Gaps between consecutive timestamps
#     consecutive_pattern    — N consecutive matching calls
#     sequence_pair          — A-then-B or A-without-B patterns
#
#   Named (complex logic, params tune thresholds):
#     tool_call_failures, ignored_errors, terminal_errors_ignored,
#     premature_completion, malformed_tool_arguments, background_check,
#     malformed_paths, failed_edit_patterns, wrong_language_search,
#     terminal_native_check, terminal_env_check, overlapping_reads,
#     premature_generic_search, file_ops, git_check,
#     edit_build_failure, edit_test_failure, fix_cycle, edit_build_loops,
#     unscoped_grep, inefficient_search, repeated_empty_searches,
#     large_file_full_read, late_dependency_install,
#     overcomplex_shell_commands
#
# =============================================================================

rules:

  # ===================================================================
  # TOOL CALL FAILURES
  # ===================================================================

  # -------------------------------------------------------------------
  # tool_call_failures
  # -------------------------------------------------------------------
  # Groups failed tool calls. Parallel failures (same timestamp) at HIGH
  # severity. Single failures at LOW (recoverable) or MEDIUM.
  #
  # Tune: Adjust parallel_window_s to widen/narrow parallel detection.
  #       Add tools to recoverable_tools to downgrade their severity.
  # -------------------------------------------------------------------
  - id: tool_call_failures
    description: "Tool calls that returned errors, grouped by parallel execution"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: tool_call_failures
    params:
      parallel_window_s: 5
      recoverable_tools: [search_replace, read_file, list_dir]
      # build_test_pattern uses BUILD_OR_TEST_RE default from patterns.py
    summary: "{summary}"
    detail: "Tool call failed ({count}x): {tools}. Error: {error_snippet}"
    recommendation: >
      Check error messages and adapt approach. For recoverable failures
      (read_file, grep), adjust parameters. For build failures, read
      the error output carefully before retrying.

  # -------------------------------------------------------------------
  # retry_without_change
  # -------------------------------------------------------------------
  # Exact same failing tool call retried without any changes.
  # This indicates the model didn't learn from the error.
  #
  # Tune: Increase min_repeat to require more retries before flagging.
  # -------------------------------------------------------------------
  - id: retry_without_change
    description: "Retried the exact same failing command without adapting"
    category: Tool Call Inefficiencies
    severity: high
    enabled: true
    detector: repeated_identical_calls
    params:
      min_repeat: 2
      error_only: true
    summary: "Retried same failing call: {tool}"
    detail: >
      The model retried the exact same tool call after it failed.
      Tool: {tool}. Input: {input_summary}.
      This suggests the model didn't adapt its approach after failure.
    recommendation: >
      After a tool call fails, analyze the error message and change
      your approach. Don't repeat the exact same call expecting
      different results.

  # ===================================================================
  # BAD BEHAVIOR PATTERNS
  # ===================================================================

  # -------------------------------------------------------------------
  # background_task_issues
  # -------------------------------------------------------------------
  # Background tasks started but never checked with
  # get_command_or_subagent_output.
  # -------------------------------------------------------------------
  - id: background_task_issues
    description: "Background tasks started but never checked"
    category: Dangerous Actions
    severity: medium
    enabled: true
    detector: background_check
    params: {}
    summary: "Background task(s) started but never checked ({count})"
    detail: >
      The model started {count} background task(s) but never checked
      their output. Unchecked task IDs: {unchecked_ids}
    recommendation: >
      Always check background task output with
      get_command_or_subagent_output before declaring work complete.

  # -------------------------------------------------------------------
  # ignored_errors
  # -------------------------------------------------------------------
  # Tool errors not addressed in the next few calls.
  #
  # Tune: Increase lookahead_window to allow more calls before flagging.
  # -------------------------------------------------------------------
  - id: ignored_errors
    description: "Tool errors not addressed in the next few calls"
    category: Transparency
    severity: high
    enabled: true
    detector: ignored_errors
    params:
      lookahead_window: 3
      skip_tools: [update_goal]
    summary: "Tool error ignored: {tool}"
    detail: "Error from {tool} was not addressed in the next calls. Error: {error_snippet}. Next actions: {next_actions}"
    recommendation: >
      When a tool call returns an error, investigate and fix it
      before moving on. Read the error message and adjust your approach.

  # -------------------------------------------------------------------
  # terminal_errors_ignored
  # -------------------------------------------------------------------
  # Terminal output with error patterns that the model ignores.
  # -------------------------------------------------------------------
  - id: terminal_errors_ignored
    description: "Terminal commands with error output not addressed"
    category: Transparency
    severity: medium
    enabled: true
    detector: terminal_errors_ignored
    params:
      lookahead_window: 3
      # error_patterns uses TERMINAL_ERROR_RE default from patterns.py
    summary: "Terminal error not addressed: `{command}`"
    detail: "Terminal command had error output ({error_snippet}) but was not addressed. Next actions: {next_actions}"
    recommendation: >
      When a terminal command produces error output, investigate the
      cause in your next few tool calls. Don't move on to unrelated work.

  # -------------------------------------------------------------------
  # premature_completion
  # -------------------------------------------------------------------
  # Task marked complete while last command had errors, or session ends
  # with unresolved errors.
  # -------------------------------------------------------------------
  - id: premature_completion
    description: "Task marked complete while recent commands had errors"
    category: Laziness - Task Incomplete
    severity: high
    enabled: true
    detector: premature_completion
    params:
      # error_patterns uses TERMINAL_ERROR_RE default from patterns.py
      completion_tools: [todo_write, update_goal]
    summary: "{summary}"
    detail: >
      Recent command `{command}` had errors ({error_snippet}) but the
      session ended or completion was declared without resolving them.
    recommendation: >
      Never declare completion when tests are failing or commands have
      errors. Run verification commands and ensure they pass first.

  # -------------------------------------------------------------------
  # malformed_paths
  # -------------------------------------------------------------------
  # File paths starting with null, undefined, None, or containing
  # control characters.
  # -------------------------------------------------------------------
  - id: malformed_paths
    description: "Tool calls using malformed file paths"
    category: Tool Call Inefficiencies
    severity: high
    enabled: true
    detector: malformed_paths
    params: {}
    summary: "{summary}"
    detail: >
      Malformed `{prefix}` path prefix in {count} tool call(s).
      Paths: {paths}
    recommendation: >
      Ensure file paths are valid. Never concatenate null/undefined
      with a path string.

  # ===================================================================
  # CONTEXT AWARENESS
  # ===================================================================

  # -------------------------------------------------------------------
  # wrong_language_search
  # -------------------------------------------------------------------
  # Grep patterns targeting a language not present in the codebase.
  # -------------------------------------------------------------------
  - id: wrong_language_search
    description: "Grep targeting language not present in the codebase"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: wrong_language_search
    params: {}
    summary: "{summary}"
    detail: "{detail}"
    recommendation: >
      Check which languages are present in the project before searching
      for language-specific patterns.

  # -------------------------------------------------------------------
  # terminal_instead_of_native_tool
  # -------------------------------------------------------------------
  # Shell commands that duplicate native tools (grep, read_file, etc).
  # -------------------------------------------------------------------
  - id: terminal_instead_of_native_tool
    description: "Shell commands used instead of native tools"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: terminal_native_check
    params:
      shell_patterns:
        - pattern: '\bgrep\s+'
          alternative: "grep tool"
          primary_only: true
        - pattern: '\brg\s+'
          alternative: "grep tool"
          primary_only: true
        - pattern: '\bfind\s+\.\s'
          alternative: "list_dir or grep --glob"
          primary_only: true
        - pattern: '\bfind\s+/'
          alternative: "list_dir or grep --glob"
          primary_only: true
        - pattern: '\bcat\s+'
          alternative: "read_file"
          primary_only: true
        - pattern: '\bhead\s+'
          alternative: "read_file with limit"
          primary_only: true
        - pattern: '\btail\s+'
          alternative: "read_file with offset"
          primary_only: true
        - pattern: '\bls\s+'
          alternative: "list_dir"
          primary_only: true
        - pattern: '\bsed\s+-n\s'
          alternative: "read_file with offset/limit"
          primary_only: true
        - pattern: '\bawk\s+'
          alternative: "grep or read_file"
          primary_only: true
        - pattern: '\btree\s+'
          alternative: "list_dir"
          primary_only: true
    summary: "Shell command duplicates native tool: use {alternative}"
    detail: >
      run_terminal_command used for an operation the native {alternative}
      handles better. Command: {command}.
      Native tools are faster, don't depend on the container environment,
      and avoid shell compatibility issues.
    recommendation: >
      Use native tools (grep, read_file, list_dir) instead of shell
      commands. They're faster, portable, and always available.

  # -------------------------------------------------------------------
  # terminal_env_incompatibility
  # -------------------------------------------------------------------
  # Commands failing due to missing binaries or incompatible flags.
  # -------------------------------------------------------------------
  - id: terminal_env_incompatibility
    description: "Terminal commands failing due to environment differences"
    category: Tool Call Inefficiencies
    severity: high
    enabled: true
    detector: terminal_env_check
    params:
      env_error_patterns:
        - pattern: 'unrecognized option'
          description: "Unrecognized flag (likely BusyBox/Alpine)"
        - pattern: 'invalid option'
          description: "Invalid option (environment mismatch)"
        - pattern: 'unknown option'
          description: "Unknown option (environment mismatch)"
        - pattern: 'command not found'
          description: "Missing binary"
        - pattern: 'No such file or directory.*bin/'
          description: "Missing binary"
        - pattern: 'not found$'
          description: "Missing command"
        - pattern: 'applet not found'
          description: "BusyBox applet not available"
    summary: "{summary}"
    detail: "{detail}"
    recommendation: >
      Use native tools where possible. Check the container environment
      before using platform-specific flags.

  # -------------------------------------------------------------------
  # unscoped_grep
  # -------------------------------------------------------------------
  # Grep with no path returning excessive matches.
  #
  # Tune: Raise min_matches to reduce noise from medium-size results.
  # -------------------------------------------------------------------
  - id: unscoped_grep
    description: "Grep without path scope returning excessive matches"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: unscoped_grep
    params:
      min_matches: 50
    summary: "Unscoped grep returned {match_count}+ matches: /{pattern}/"
    detail: >
      Grep with no path scope returned {match_count}+ matches.
      Pattern: {pattern}. Scoping to a specific directory would reduce noise.
    recommendation: >
      Scope grep to a specific directory (e.g. src/) rather than
      searching the entire workspace. Use --glob to filter by file type.

  # -------------------------------------------------------------------
  # overlapping_file_reads
  # -------------------------------------------------------------------
  # Multiple reads of the same file with overlapping line ranges.
  # -------------------------------------------------------------------
  - id: overlapping_file_reads
    description: "Multiple reads of same file with overlapping ranges"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: overlapping_reads
    params:
      min_reads: 3
      overlap_threshold: 0.3
    summary: "Overlapping reads on {file} ({overlap_count} overlaps)"
    detail: "{detail}"
    recommendation: >
      Read files in larger, non-overlapping chunks. A single wider
      read or targeted grep would be more efficient.

  # -------------------------------------------------------------------
  # premature_generic_search
  # -------------------------------------------------------------------
  # Multi-language or generic search patterns before understanding
  # the project structure.
  # -------------------------------------------------------------------
  - id: premature_generic_search
    description: "Generic search patterns before identifying project type"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: premature_generic_search
    params:
      orientation_reads: 2
      generic_patterns: '(?:eval|exec|system|sql|inject|xss|csrf|deserializ|pickle|yaml\.load|shell_exec|TODO|FIXME|HACK|XXX|BUG|DEPRECATED)'
      shotgun_patterns: '^(?:error|bug|fix|issue|problem|crash|fail|broken)$'
    summary: "Premature {reason} before exploring project structure"
    detail: "{detail}"
    recommendation: >
      Run list_dir first to understand the project structure and
      language, then tailor search patterns to the actual codebase.

  # -------------------------------------------------------------------
  # excessive_planning_overhead
  # -------------------------------------------------------------------
  # Disproportionate todo_write calls relative to substantive work.
  # -------------------------------------------------------------------
  - id: excessive_planning_overhead
    description: "Excessive todo_write calls relative to substantive work"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: session_metric
    params:
      metric: tool_ratio
      numerator_tools: [todo_write]
      threshold: 0.15
      min_total: 10
    summary: "Planning overhead: {numerator}/{total} calls ({ratio:.0%}) are todo_write"
    detail: >
      todo_write was called {numerator} times out of {total} total tool calls
      ({ratio:.0%}). Extensive todo tracking adds overhead without
      proportional value.
    recommendation: >
      Reduce todo_write calls. Plan mentally and execute -- extensive
      todo tracking adds overhead without proportional value.

  # -------------------------------------------------------------------
  # low_tool_call_density
  # -------------------------------------------------------------------
  # Sessions with very few tool calls relative to duration.
  #
  # Tune: Lower density_threshold for stricter, raise for more lenient.
  # -------------------------------------------------------------------
  - id: low_tool_call_density
    description: "Very low tool usage relative to session duration"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: session_metric
    params:
      metric: density
      threshold: 0.05
      comparison: lt
      min_total: 5
    summary: "Low tool density: {metric_value:.3f} calls/sec over {duration:.0f}s"
    detail: >
      The model made {total} tool calls over {duration:.0f} seconds
      ({metric_value:.3f} calls/sec). This is extremely low, suggesting
      the model spent most of the session reasoning rather than acting.
    recommendation: >
      Spend less time reasoning and more time acting. Make focused tool
      calls rather than extended internal deliberation.

  # ===================================================================
  # EDIT PATTERNS
  # ===================================================================

  # -------------------------------------------------------------------
  # failed_edit_patterns
  # -------------------------------------------------------------------
  # Classifies search_replace failures: no-op edits, ambiguous matches,
  # blind retries without re-reading the file.
  # -------------------------------------------------------------------
  - id: failed_edit_patterns
    description: "search_replace failures: no-op, ambiguous, blind retries"
    category: Code Correctness
    severity: medium
    enabled: true
    detector: failed_edit_patterns
    params: {}
    summary: "{summary}"
    detail: "Failed edit pattern ({type}): {count} occurrence(s) in {files}"
    recommendation: >
      Re-read the file after a failed edit to see actual content. Use a
      longer, more unique old_string. Verify old_string != new_string.

  # ===================================================================
  # GIT ISSUES
  # ===================================================================

  # -------------------------------------------------------------------
  # git_issues
  # -------------------------------------------------------------------
  # Parallel git commands (lock contention) and batchable sequential
  # git calls.
  # -------------------------------------------------------------------
  - id: git_issues
    description: "Parallel or batchable sequential git commands"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: git_check
    params:
      batchable_subcmds: [add, rm, checkout, reset, restore, stage]
    summary: "{summary}"
    detail: "{detail}"
    recommendation: >
      Batch git operations into a single command. Avoid running
      multiple git commands in parallel (they contend on the lock file).

  # ===================================================================
  # INEFFICIENCY
  # ===================================================================

  # -------------------------------------------------------------------
  # inefficient_searches
  # -------------------------------------------------------------------
  # Overly broad grep patterns that match too many lines.
  # -------------------------------------------------------------------
  - id: inefficient_searches
    description: "Overly broad grep/search patterns"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: inefficient_search
    params:
      min_matches: 100
    summary: "{summary}"
    detail: "{detail}"
    recommendation: >
      Use more specific search terms and scope to relevant directories.
      A targeted grep is much more useful than a broad one.

  # -------------------------------------------------------------------
  # redundant_calls
  # -------------------------------------------------------------------
  # Same tool call repeated with no file edits in between.
  #
  # Tune: Increase min_repeat to allow more repeats before flagging.
  # -------------------------------------------------------------------
  - id: redundant_calls
    description: "Identical tool calls repeated with no mutations between"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: repeated_identical_calls
    params:
      min_repeat: 2
      high_threshold: 5
    summary: "Same {tool} call repeated {count}x: {input_summary}"
    detail: >
      Same {tool} call repeated {count}x without any mutations in between.
      Input: {input_summary}
    recommendation: >
      Don't repeat the exact same tool call expecting different results.
      Change the approach or parameters.

  # -------------------------------------------------------------------
  # file_edit_churn
  # -------------------------------------------------------------------
  # Single file edited an excessive number of times.
  #
  # Tune: Raise min_edits to allow more edits before flagging.
  # -------------------------------------------------------------------
  - id: file_edit_churn
    description: "Single file edited excessively (15+ times)"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: count_matching_calls
    params:
      tools: [search_replace]
      group_by: file_path
      group_min: 15
      high_threshold: 25
    summary: "File {group_key} edited {count}x ({error_count} failed)"
    detail: >
      The file '{group_key}' was edited {count} times ({error_count} failed).
      This level of churn suggests trial-and-error editing rather than
      understanding the code and making coherent, planned modifications.
    recommendation: >
      Read the file carefully, understand the full context, and make
      coherent changes rather than many incremental trial-and-error edits.

  # -------------------------------------------------------------------
  # file_operation_issues
  # -------------------------------------------------------------------
  # Re-reads from offset 0, fragmented reads, and edits without
  # reading the file first.
  # -------------------------------------------------------------------
  - id: file_operation_issues
    description: "Re-reads, fragmented reads, and edits without reading first"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: file_ops
    params:
      min_small_reads: 4
      small_read_limit: 50
    summary: "{summary}"
    detail: "{detail}"
    recommendation: >
      Read files in larger chunks. Always read a file before editing it.
      Don't re-read from offset 0 if you already have the content.

  # -------------------------------------------------------------------
  # read_after_own_edit
  # -------------------------------------------------------------------
  # Reading a file shortly after editing it (wasted call).
  # -------------------------------------------------------------------
  - id: read_after_own_edit
    description: "Read file shortly after editing it"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: sequence_pair
    params:
      trigger:
        tools: [search_replace]
      follower:
        tools: [read_file]
      window: 3
      match_fields: [file_path:target_file]
      trigger_success_only: true
    summary: "Read file shortly after editing it: {file}"
    detail: >
      The model read '{file}' shortly after its own search_replace.
      Since it just wrote the content, it should already know what's there.
    recommendation: >
      Trust your own writes. Don't read a file immediately after
      editing it -- you already know the content.

  # -------------------------------------------------------------------
  # repeated_empty_searches
  # -------------------------------------------------------------------
  # Repeated grep calls returning zero results on the same path.
  # -------------------------------------------------------------------
  - id: repeated_empty_searches
    description: "Repeated grep calls returning zero results on same path"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: repeated_empty_searches
    params:
      group_min: 3
    summary: "Repeated empty greps on `{group_key}` ({count}x)"
    detail: >
      The model searched under '{group_key}' {count} times with
      different patterns, all returning zero results.
      Patterns tried: {patterns}
    recommendation: >
      After getting empty results, adjust the search pattern or path
      rather than retrying the same failing approach.

  # -------------------------------------------------------------------
  # edit_build_fail_loops
  # -------------------------------------------------------------------
  # Excessive edit-build-fail cycles on the same file.
  # -------------------------------------------------------------------
  - id: edit_build_fail_loops
    description: "3+ edit-build-fail cycles on the same file"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: edit_build_loops
    params:
      min_cycles: 3
    summary: "Excessive edit-build-fail loop on {file} ({cycle_count} cycles)"
    detail: >
      The model edited '{file}', ran a build, got an error, and edited
      the same file again {cycle_count} times.
    recommendation: >
      Read the error output carefully, understand the root cause, and
      fix it in one edit rather than incremental guess-and-check changes.

  # ===================================================================
  # SESSION PATTERNS
  # ===================================================================

  # -------------------------------------------------------------------
  # malformed_tool_arguments
  # -------------------------------------------------------------------
  # Grep calls with flags leaked into path field, embedded quotes, etc.
  # -------------------------------------------------------------------
  - id: malformed_tool_arguments
    description: "Tool calls with malformed or cross-contaminated arguments"
    category: Tool Call Inefficiencies
    severity: high
    enabled: true
    detector: malformed_tool_arguments
    params: {}
    summary: "{summary}"
    detail: "Malformed {field_name}: {value}"
    recommendation: >
      Serialize each argument into its correct parameter field. Check
      that file paths are valid and don't contain flags or quotes.

  # -------------------------------------------------------------------
  # long_reasoning_stall
  # -------------------------------------------------------------------
  # Gaps of 120+ seconds between consecutive tool calls.
  #
  # Tune: Raise threshold_seconds to allow longer thinking.
  #       Add tools to slow_tools for higher threshold after those.
  # -------------------------------------------------------------------
  - id: long_reasoning_stall
    description: "Large gaps between tool calls indicating reasoning stalls"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: time_gap
    params:
      threshold_seconds: 120
      slow_tools: [web_search, spawn_subagent, enter_plan_mode, exit_plan_mode, get_command_or_subagent_output]
      slow_tool_threshold_seconds: 300
      high_severity_seconds: 300
      timeout_range: [298, 310]
      # Build/configure commands that routinely take 2-5 minutes
      slow_cmd_pattern: '\b(?:make|cmake|configure|bootstrap|autoreconf|cargo\s+build|go\s+build|npm\s+(?:run\s+build|install)|pip\s+install|git\s+(?:clone|submodule))\b|\.\/configure|\.\/bootstrap'
    summary: "Reasoning stall: {gap:.0f}s gap between tool calls{timeout_note}"
    detail: >
      There was a {gap:.0f}-second gap between consecutive tool calls.
      Before: {prev_tool}. After: {curr_tool}.
      Long pauses waste wall-clock time and can lead to timeouts.
    recommendation: >
      Break complex reasoning into smaller steps. Make a tool call to
      gather information rather than reasoning about everything at once.

  # -------------------------------------------------------------------
  # edit_causes_build_failure
  # -------------------------------------------------------------------
  # Code edit followed by a build/compile failure or runtime crash.
  # -------------------------------------------------------------------
  - id: edit_causes_build_failure
    description: "Code edit followed by build/compile failure"
    category: Regression Safety
    severity: high
    enabled: true
    detector: edit_build_failure
    params:
      max_per_file: 4
    summary: "Edit to {edit_file} caused build failure/crash"
    detail: "{detail}"
    recommendation: >
      Reason through the edit completely before writing. Check types,
      includes, and declarations so the code compiles on the first attempt.

  # -------------------------------------------------------------------
  # edit_causes_test_failure
  # -------------------------------------------------------------------
  # Code edit followed by test crash or failure.
  # -------------------------------------------------------------------
  - id: edit_causes_test_failure
    description: "Code edit followed by test crash or failure"
    category: Regression Safety
    severity: high
    enabled: true
    detector: edit_test_failure
    params:
      max_per_file: 4
    summary: "Edit to {edit_files} caused test crash/failure"
    detail: "{detail}"
    recommendation: >
      Consider pointer lifetimes, error paths, and edge cases before
      editing. Read the surrounding code and test expectations first.

  # -------------------------------------------------------------------
  # runtime_package_install
  # -------------------------------------------------------------------
  # System packages installed mid-session (apt, pip, npm -g).
  #
  # Tune: Edit the regex to catch more/fewer install commands.
  # -------------------------------------------------------------------
  - id: runtime_package_install
    description: "System packages installed mid-session"
    category: Code Scope
    severity: medium
    enabled: true
    detector: count_matching_calls
    params:
      tools: [run_terminal_command]
      input_patterns:
        command: 'apt-get\s+install|apt\s+install|yum\s+install|dnf\s+install|apk\s+add|pacman\s+-S|brew\s+install|pip\s+install(?!\s+-e\s+\.)|npm\s+install\s+-g'
      min_count: 1
    summary: "Installed {count} package(s) at runtime"
    detail: >
      The model ran {count} package install command(s) during the session.
      Commands: {matched_commands}.
      Build tools and test dependencies should be in the Docker image.
    recommendation: >
      Use tools and packages already available in the Docker image.
      Installing at runtime wastes tool calls and session time.

  # -------------------------------------------------------------------
  # analysis_paralysis
  # -------------------------------------------------------------------
  # Session spent entirely on reading with no edits or output.
  # -------------------------------------------------------------------
  - id: analysis_paralysis
    description: "Read-only session with no edits, commands, or output"
    category: Laziness - Task Incomplete
    severity: medium
    enabled: true
    detector: session_metric
    params:
      metric: read_before_action
      read_tools: [grep, read_file, list_dir, web_search, todo_write]
      action_tools: []
      threshold: 1.0
      min_total: 10
      min_reads: 10
      require_no_text_output: true
      min_duration: 120
    summary: "{summary}"
    detail: "{detail}"
    recommendation: >
      Deliver interim findings rather than reading indefinitely. Start
      editing or answering after a reasonable investigation phase.

  # -------------------------------------------------------------------
  # multi_round_fix_cycle
  # -------------------------------------------------------------------
  # 3+ edit-build-fail cycles on the same file.
  # -------------------------------------------------------------------
  - id: multi_round_fix_cycle
    description: "3+ edit-build-fail cycles on same file before success"
    category: Code Correctness
    severity: medium
    enabled: true
    detector: fix_cycle
    params:
      min_cycles: 3
    summary: "{cycle_count} edit-fail cycles on {file}"
    detail: "{detail}"
    recommendation: >
      Read the error output carefully, understand the root cause, and
      fix it in one edit. After 2-3 failures, try a different approach.

  # -------------------------------------------------------------------
  # edit_via_terminal
  # -------------------------------------------------------------------
  # File edits done via cat/tee heredoc instead of search_replace.
  # -------------------------------------------------------------------
  - id: edit_via_terminal
    description: "Project file edits via cat/tee heredoc instead of search_replace"
    category: Dangerous Actions
    severity: medium
    enabled: true
    detector: count_matching_calls
    params:
      tools: [run_terminal_command]
      # Only count writes under /workspace or relative project paths — not /tmp test scripts
      input_patterns:
        command: '(?:cat|tee)\s+>?\s*(?:/workspace/|\./)?(?:src|pkg|lib|tests?|app)/[^\s<]+\s*<<|(?:cat|tee)\s+>?\s*/workspace/[^\s<]+\s*<<'
      min_count: 3
      high_threshold: 10
    summary: "Wrote {count} project file(s) via terminal instead of search_replace"
    detail: >
      The model used cat/tee heredocs to write project files (under
      /workspace or src/pkg/lib/tests) {count} times. /tmp scratch scripts
      are excluded. Terminal file writes are invisible to edit-tracking
      rules and don't get the safety checks of search_replace.
    recommendation: >
      Use search_replace for file edits. It provides safety checks
      (unique match, diff preview) and makes edits visible to analysis.

  # -------------------------------------------------------------------
  # excessive_investigation
  # -------------------------------------------------------------------
  # Disproportionate read-only phase before first edit/action.
  #
  # Tune: Raise threshold to allow more investigation before flagging.
  # -------------------------------------------------------------------
  - id: excessive_investigation
    description: "Disproportionate read-only phase before first action"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: session_metric
    params:
      metric: read_before_action
      read_tools: [grep, read_file, list_dir, web_search]
      action_tools: [search_replace, run_terminal_command]
      threshold: 0.5
      min_total: 15
      min_reads: 15
      exclude_investigative_cmds: true
    summary: "{numerator} read-only calls ({ratio:.0%}) before first action"
    detail: >
      The model made {numerator} read-only calls out of {total} total
      ({ratio:.0%}) before its first substantive action.
      While investigation is important, a more targeted approach would
      start acting sooner.
    recommendation: >
      Start acting sooner. After 10-15 read calls, form a hypothesis
      and start editing rather than continuing to explore indefinitely.

  # -------------------------------------------------------------------
  # web_search_for_answer
  # -------------------------------------------------------------------
  # Model searches the web for someone else's fix.
  # -------------------------------------------------------------------
  - id: web_search_for_answer
    description: "Web search for someone else's solution"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: count_matching_calls
    params:
      tools: [web_search]
      input_patterns:
        query: '(?:fix|solution|patch|resolve|workaround|how to fix)|site:(?:github\.com|stackoverflow\.com)|(?:memory\s+leak|bug|crash|segfault).*(?:fix|patch|solution)'
      min_count: 1
    summary: "Web search for task solution: {query}"
    detail: >
      The model searched the web for what appears to be someone else's
      solution. Query: {query}.
      While research is sometimes valuable, the model should primarily
      reason from the codebase.
    recommendation: >
      Reason through the codebase directly. Read the relevant source,
      understand the bug from first principles, and write the fix yourself.

  # -------------------------------------------------------------------
  # overcomplex_shell_commands
  # -------------------------------------------------------------------
  # Models pack entire scripts into a single run_terminal_command.
  # These are hard to debug, fragile across environments, and should
  # be broken into discrete steps.
  #
  # Tune: Raise min_length for stricter (only very long), raise
  #       min_count to tolerate occasional long commands.
  # -------------------------------------------------------------------
  - id: overcomplex_shell_commands
    description: "Structurally complex shell pipelines (long + many pipes/chains)"
    category: Code Quality
    severity: medium
    enabled: true
    detector: overcomplex_shell_commands
    params:
      min_length: 300
      min_count: 5
      high_threshold: 25   # only escalate when it's a dominant session pattern
      min_pipes: 3
      min_chains: 5
    summary: "{count} complex shell pipelines (max {max_length} chars)"
    detail: >
      The model ran {count} structurally complex shell commands (long with
      many pipes/chains). Longest: {max_length} chars with {max_pipes} pipes
      and {max_chains} chains. Average length: {avg_length} chars.
      Orientation chains (git/ls) and heredoc/inline scripts are excluded.
      Overly complex one-liners are fragile and hard to debug when they
      fail. Break them into discrete tool calls.
    recommendation: >
      Break long shell commands into separate steps. Use native tools
      (grep, read_file) instead of piped shell commands. If a multi-step
      pipeline is truly needed, write it as a script file first.

  # -------------------------------------------------------------------
  # large_file_full_read
  # -------------------------------------------------------------------
  # Reading large files in full without offset/limit wastes context.
  # Common in C codebases where source files are 500-3000 lines.
  #
  # Tune: Raise min_lines to only flag very large files.
  #       Set extensions to limit to specific file types.
  # -------------------------------------------------------------------
  - id: large_file_full_read
    description: "Reading large files without offset/limit"
    category: Tool Call Inefficiencies
    severity: low
    enabled: true
    detector: large_file_full_read
    params:
      min_lines: 500
      extensions: []
    summary: "Full read of {file} ({line_count} lines without offset/limit)"
    detail: >
      read_file on '{path}' returned {line_count} lines without
      offset or limit. Large files consume context window and make it
      harder for the model to focus on the relevant section. Use grep
      to find the target function first, then read with offset/limit.
    recommendation: >
      Use grep to locate the relevant function or section first, then
      use read_file with offset and limit to read only what you need.

  # -------------------------------------------------------------------
  # late_dependency_install
  # -------------------------------------------------------------------
  # Build fails, then model installs missing packages. Should have
  # checked dependencies before the first build attempt.
  #
  # Tune: Increase max_gap to allow more calls between failure and
  #       install before considering them related.
  # -------------------------------------------------------------------
  - id: late_dependency_install
    description: "Build failed, then installed missing dependencies"
    category: Tool Call Inefficiencies
    severity: medium
    enabled: true
    detector: late_dependency_install
    params:
      max_gap: 5
    summary: "Late dependency install after build failure: {packages}"
    detail: >
      Build command failed: `{build_command}`.
      Then installed packages: {packages}.
      The model should check for required build dependencies before
      attempting the first build, not discover them reactively.
    recommendation: >
      Before building, check what tools the project needs (look at
      configure.ac, CMakeLists.txt, Makefile, or README). Install all
      required dependencies upfront rather than discovering them one
      at a time through build failures.

  # -------------------------------------------------------------------
  # repeated_crashes_no_adapt
  # -------------------------------------------------------------------
  # 3+ consecutive terminal crashes without changing approach.
  # -------------------------------------------------------------------
  # ===================================================================
  # INTEGRITY — Hallucination & Transparency
  # ===================================================================

  # -------------------------------------------------------------------
  # false_completion_claim
  # -------------------------------------------------------------------
  # Model claims success (update_goal completed, "all tests pass") but
  # recent terminal commands show failures. Three sub-patterns:
  # a) Completion tool + recent failures
  # b) Assistant text contradicts last command output
  # c) Verification claim with zero terminal commands
  #
  # Tune: Increase lookback_window to scan more history before flagging.
  # -------------------------------------------------------------------
  - id: false_completion_claim
    description: "Model claims success but evidence shows failures"
    category: Hallucination
    severity: high
    enabled: true
    detector: false_completion_claim
    params:
      lookback_window: 8
      completion_tools: [update_goal, todo_write]
    summary: "{summary}"
    detail: "{detail}"
    recommendation: >
      Never claim completion without verifying. Run the build/test
      command, confirm it passes, then declare success. If a test
      failed, acknowledge and fix it before marking the task complete.

  # -------------------------------------------------------------------
  # hidden_failure
  # -------------------------------------------------------------------
  # Model encounters a clear failure but continues without
  # acknowledging it. Two sub-patterns:
  # a) Failed command not mentioned in the next assistant message
  # b) Test/build failure followed by editing an unrelated file
  # -------------------------------------------------------------------
  - id: hidden_failure
    description: "Model encounters failure and continues without acknowledging"
    category: Transparency
    severity: medium
    enabled: true
    detector: hidden_failure
    params: {}
    summary: "{summary}"
    detail: "{detail}"
    recommendation: >
      When a command fails, acknowledge the error in your response.
      Read the error output, explain what went wrong, and either fix
      the issue or explain why you're taking a different approach.

  # -------------------------------------------------------------------
  # repeated_crashes_no_adapt
  # -------------------------------------------------------------------
  # 3+ consecutive terminal crashes without changing approach.
  # -------------------------------------------------------------------
  - id: repeated_crashes_no_adapt
    description: "Multiple consecutive crashes without adapting"
    category: Tool Call Inefficiencies
    severity: high
    enabled: true
    detector: consecutive_pattern
    params:
      tools: [run_terminal_command]
      match_condition: crash
      crash_patterns: 'Segmentation fault|SIGSEGV|SIGABRT|SIGBUS|core dumped|double free|heap-use-after-free|AddressSanitizer|panic:'
      min_streak: 3
      reset_tools: [search_replace, web_search]
    summary: "{streak_count} consecutive crashes without adapting approach"
    detail: >
      The model ran {streak_count} terminal commands that all crashed
      without fundamentally changing its approach. Commands: {commands}.
      After the first crash, the model should diagnose the root cause.
    recommendation: >
      After the first crash, stop and diagnose the root cause. Read the
      relevant code, add assertions or debug prints strategically, and
      understand why it crashes before running the same program again.