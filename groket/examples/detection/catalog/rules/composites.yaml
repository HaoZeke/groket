# yaml-language-server: $schema=https://indynull.github.io/groket/schemas/rules.schema.json
# Local schema: schemas/rules.schema.json (make schema)
# Validate: uv run groket rules validate examples/detection/catalog/rules/composites.yaml
#
# =============================================================================
# COMPOSITE RULES
# =============================================================================
# Composites detect causal chains across leaf rule findings.
# When a composite matches, its child issues are suppressed from the
# top-level list so the user sees "1 composite finding" instead of
# "15 overlapping leaf issues".
#
# Relationship types:
#   overlapping_calls  — child issues share tool call IDs
#   overlapping_indices — child issues' update_index ranges overlap
#   sequential         — child issues appear in order within max_gap
#   repeat             — single child rule fires min_repeat+ times
#   co_occurrence      — all child rules fire in same session (no overlap needed)
# =============================================================================

composites:
  - id: serialization_cascade
    name: "Argument serialization bug with cascading empty results"
    severity: high
    child_rules: [malformed_tool_arguments, repeated_empty_searches]
    relationship: overlapping_calls
    root_cause: >
      The model's argument serializer leaks grep flags (-i, -B) into the
      path field. Every malformed call returns empty results, which then
      triggers repeated-empty-search detection. The empty searches are
      not a separate problem -- they are a symptom of the serialization bug.
    should_have: >
      Fix the argument serialization so each parameter maps to its correct
      field. Once the root cause is fixed, all downstream empty-search
      noise disappears.

  - id: terminal_fallback_spiral
    name: "Shell fallback hits environment incompatibility"
    severity: high
    child_rules: [terminal_instead_of_native_tool, terminal_env_incompatibility]
    relationship: co_occurrence
    root_cause: >
      The model falls back to shell commands instead of using native tools,
      then the shell commands fail because the container doesn't have the
      expected binaries. The env incompatibility is a direct consequence of
      the unnecessary shell fallback.
    should_have: >
      Use native tools (grep, read_file, list_dir) which work in any
      environment. The env failure would not have happened if the model
      had not fallen back to shell in the first place.

  - id: terminal_install_compensation
    name: "Shell reliance forces runtime package installation"
    severity: medium
    child_rules: [terminal_instead_of_native_tool, runtime_package_install]
    relationship: co_occurrence
    root_cause: >
      The model relies on shell commands, discovers tools are missing,
      and compensates by installing packages at runtime. The install is
      a workaround for the unnecessary shell dependency.
    should_have: >
      Use native tools instead of shell commands. No packages need to be
      installed if the model uses the tools it already has.

  - id: persistent_malformed_no_adapt
    name: "Repeated serialization bug without self-correction"
    severity: high
    child_rules: [malformed_tool_arguments]
    relationship: repeat
    min_repeat: 3
    root_cause: >
      The model makes the same argument serialization error repeatedly
      across multiple tool calls without ever recognizing or correcting
      the pattern. It does not learn from the error responses.
    should_have: >
      After the first malformed call returns an error, the model should
      inspect the error message, recognize the argument mapping issue,
      and correct subsequent calls.

  - id: blind_fix_spiral
    name: "Repeated edit failures escalate into a multi-round fix cycle"
    severity: high
    child_rules: [failed_edit_patterns, multi_round_fix_cycle]
    relationship: sequential
    max_gap: 50
    root_cause: >
      The model makes broken edits (no-op or mismatched old_string),
      compounding into 3+ edit-fail cycles. Each retry fails because
      the model assumes file content instead of re-reading.
    should_have: >
      Re-read the file after a failed edit to see the actual content,
      then reason through the fix completely before writing.

  - id: edit_break_fix_chain
    name: "Edit causes failure followed by multi-round fix attempts"
    severity: high
    child_rules: [edit_causes_build_failure, multi_round_fix_cycle]
    relationship: overlapping_calls
    root_cause: >
      The model writes an edit that breaks the build, then enters a
      trial-and-error loop trying to fix it. The initial careless edit
      triggers a costly recovery cycle.
    should_have: >
      Reason through the edit completely before writing. Check types,
      includes, and declarations so the code compiles on the first attempt.

  - id: crash_loop_via_terminal_edit
    name: "Terminal file writes produce repeated crashes"
    severity: high
    child_rules: [edit_via_terminal, repeated_crashes_no_adapt]
    relationship: overlapping_calls
    root_cause: >
      The model writes test files via cat/tee heredocs, compiles and runs them,
      and they crash repeatedly. Because the edits bypass search_replace, the
      edit-build-fail tracking is invisible, and the model doesn't learn from crashes.
    should_have: >
      Use search_replace for file edits so the pipeline can track edit-fail cycles.
      After the first crash, diagnose the root cause before writing another test.

  - id: stalled_investigation
    name: "Investigation phase with repeated reasoning stalls"
    severity: high
    child_rules: [excessive_investigation, long_reasoning_stall]
    relationship: overlapping_indices
    root_cause: >
      The model spends an excessive read-only phase investigating the codebase,
      and within that phase it stalls repeatedly (60+ second gaps between tool calls).
      The investigation is not just long -- it's punctuated by periods of getting stuck.
    should_have: >
      Start forming hypotheses earlier and test them with small edits or targeted
      commands. If stuck reasoning for >60s, make the next best tool call instead
      of trying to figure everything out in advance.

  - id: investigation_then_copy_answer
    name: "Excessive investigation followed by web search for answer"
    severity: medium
    child_rules: [excessive_investigation, web_search_for_answer]
    relationship: overlapping_indices
    root_cause: >
      The model spends extensive time reading the codebase, then gives up reasoning
      and searches the web for someone else's fix. The investigation was wasted.
    should_have: >
      Form a hypothesis during investigation, then test it with edits. If truly
      stuck after focused investigation, a web search is acceptable -- but it
      shouldn't replace reasoning from the code.

  - id: fragmented_investigation
    name: "Investigation with fragmented file reads and broad searches"
    severity: medium
    child_rules: [file_operation_issues, inefficient_searches]
    relationship: overlapping_indices
    root_cause: >
      The model reads files in tiny overlapping fragments and uses overly broad
      grep patterns, wasting tool calls on noisy results. This compounds to make
      the investigation phase longer and less focused than necessary.
    should_have: >
      Read files in larger, non-overlapping chunks. Use specific grep patterns
      that target the actual construct being searched for, not generic terms
      that match hundreds of lines.

  - id: error_blind_completion
    name: "Declares completion despite unresolved test failures"
    severity: high
    child_rules: [edit_causes_test_failure, premature_completion]
    relationship: sequential
    max_gap: 100
    root_cause: >
      The model edits code that breaks tests, then declares the task complete
      without fixing the test failures. The completion is premature because the
      model's own edits left the codebase in a broken state.
    should_have: >
      Never declare completion when tests are failing due to your own edits.
      Run the full test suite and ensure it passes before marking the task done.

  - id: circular_investigation
    name: "Investigation phase with redundant repeated searches"
    severity: medium
    child_rules: [redundant_calls, excessive_investigation]
    relationship: overlapping_indices
    root_cause: >
      The model spends an excessive read-only phase investigating the codebase,
      and within that phase it repeats the same searches multiple times. The
      model is going in circles rather than making progress.
    should_have: >
      Track what you've already searched for and read. If you find yourself
      re-reading the same files or re-running the same greps, stop and form
      a hypothesis to test.

  - id: fragmented_file_access
    name: "Fragmented reads with overlapping ranges"
    severity: low
    child_rules: [file_operation_issues, overlapping_file_reads]
    relationship: overlapping_indices
    root_cause: >
      The model reads files in many small fragments that overlap each other,
      wasting tool calls on re-reading the same content. The fragmented reads
      and overlapping reads are two symptoms of the same inefficient file
      access pattern.
    should_have: >
      Read files in larger chunks or read the whole file at once. When you need
      to see a specific section, use offset/limit with non-overlapping ranges.

  - id: stuck_test_loop
    name: "Stuck in repeated test failure loop on same file"
    severity: high
    child_rules: [edit_causes_test_failure, edit_build_fail_loops]
    relationship: overlapping_indices
    root_cause: >
      The model repeatedly edits the same file and runs tests that fail,
      creating an edit-test-fail loop without making meaningful progress.
      This wastes many tool calls on variations of the same broken approach.
    should_have: >
      After 2-3 failed attempts at fixing the same file, step back and
      re-read the code more carefully, check test expectations, or try
      a fundamentally different approach rather than tweaking the same edit.

  - id: env_install_cascade
    name: "Environment failures trigger cascading package installs"
    severity: medium
    child_rules: [terminal_env_incompatibility, runtime_package_install]
    relationship: sequential
    max_gap: 10
    root_cause: >
      The model hits missing binary or incompatible flag errors, then installs
      packages to work around them. Each install wastes time and may introduce
      more compatibility issues.
    should_have: >
      Check what tools are available before using them. Use native tools
      (grep, read_file, list_dir) which don't depend on the container environment.

  - id: timeout_stalled_session
    name: "Session dominated by reasoning timeouts with low productivity"
    severity: high
    child_rules: [long_reasoning_stall, low_tool_call_density]
    relationship: co_occurrence
    root_cause: >
      The model hit multiple reasoning timeouts (~300s gaps) and its overall
      tool call density is very low. The session was dominated by the model
      getting stuck thinking rather than making progress on the task.
    should_have: >
      Break complex reasoning into smaller steps. Make a tool call to gather
      information rather than trying to reason about everything at once.
      If stuck for >60s, try a different approach.

  - id: churn_failure_spiral
    name: "Excessive file churn combined with repeated build/test failures"
    severity: high
    child_rules: [file_edit_churn, edit_causes_build_failure]
    relationship: overlapping_indices
    root_cause: >
      The model edited the same file an extreme number of times while also
      triggering repeated build or test failures. This indicates the model is
      stuck in a trial-and-error loop -- making small changes, seeing them fail,
      and trying again without stepping back to understand the root cause.
    should_have: >
      After 2-3 failed attempts at fixing the same file, stop and re-read the
      relevant code and error messages carefully. Consider whether the approach
      is fundamentally wrong and needs a different strategy, not more small tweaks.