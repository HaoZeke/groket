[package]
name = "groket-hud"
version = "0.1.0"
description = "Sol-style session palette for groket control plane"
authors = ["Ali-Akber Saifee"]
edition = "2021"

[lib]
name = "groket_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
